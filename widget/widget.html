<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WILDS Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="widget.css" />
</head>
<body>

  <!-- Grain overlay (sits above everything, never blocks pointer) -->
  <div id="grain"></div>

  <!-- Hover bar -->
  <div id="action-bar">
    <button class="act-btn small" id="btn-quit" title="Quit">✕</button>
    <button class="act-btn small" id="btn-pin" title="Toggle desktop mode">📌</button>
    <div id="action-buttons">
      <button class="act-pill" data-panel="feed">Feed</button>
      <button class="act-pill" data-panel="train">Train</button>
      <button class="act-pill" id="btn-pet">Pet</button>
      <button class="act-pill" id="btn-bathe">Clean</button>
      <button class="act-pill" data-panel="stats">Stats</button>
      <button class="act-pill" data-panel="habitat">Habitat</button>
    </div>
    <span class="creature-label" id="creature-label">VEX</span>
  </div>

  <!-- Sliding action panel -->
  <div id="action-panel">

    <!-- Feed panel -->
    <div class="panel-page" id="panel-feed">
      <div class="panel-title">What should <span id="feed-name">Vex</span> eat?</div>
      <div class="food-grid" id="food-grid"></div>
    </div>

    <!-- Stats panel -->
    <div class="panel-page" id="panel-stats">
      <div class="stats-grid">
        <div class="needs-col">
          <div class="stat-row"><span class="stat-label">HUNGER</span><div class="stat-bar"><div class="stat-fill" id="bar-hunger"></div></div><span class="stat-val" id="val-hunger">--</span></div>
          <div class="stat-row"><span class="stat-label">ENERGY</span><div class="stat-bar"><div class="stat-fill" id="bar-energy"></div></div><span class="stat-val" id="val-energy">--</span></div>
          <div class="stat-row"><span class="stat-label">MOOD</span><div class="stat-bar"><div class="stat-fill" id="bar-mood"></div></div><span class="stat-val" id="val-mood">--</span></div>
          <div class="stat-row"><span class="stat-label">HYGIENE</span><div class="stat-bar"><div class="stat-fill" id="bar-hygiene"></div></div><span class="stat-val" id="val-hygiene">--</span></div>
        </div>
        <div class="evo-col">
          <div class="evo-label">EVOLUTION</div>
          <div class="evo-paths" id="evo-paths"></div>
          <div class="panel-footer-btns">
            <button id="btn-achievements" class="panel-footer-btn">Achievements</button>
            <button id="btn-settings"     class="panel-footer-btn">Settings</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Habitat panel -->
    <div class="panel-page" id="panel-habitat">
      <div class="panel-title">Habitat</div>
      <div id="habitat-info" class="habitat-info">
        <div class="habitat-name" id="habitat-name"></div>
        <div class="habitat-desc" id="habitat-desc"></div>
        <div class="habitat-creatures" id="habitat-creatures"></div>
      </div>
    </div>

    <!-- Train panel -->
    <div class="panel-page" id="panel-train">
      <div class="panel-title">Training</div>
      <div class="train-content">
        <div id="train-prompt" class="train-prompt">TAP WHEN YOU SEE IT</div>
        <button id="train-tap" class="train-tap">●</button>
        <div id="train-result" class="train-result"></div>
      </div>
    </div>

    <!-- Achievements panel -->
    <div class="panel-page" id="panel-achievements">
      <div class="panel-nav">
        <button class="panel-back-btn" data-panel="stats">← Stats</button>
        <span class="panel-nav-title">Achievements</span>
      </div>
      <div id="achievement-list" class="achievement-list"></div>
    </div>

    <!-- Settings panel -->
    <div class="panel-page" id="panel-settings">
      <div class="panel-nav">
        <button class="panel-back-btn" data-panel="stats">← Stats</button>
        <span class="panel-nav-title">Settings</span>
      </div>
      <div class="settings-list">
        <div class="setting-row">
          <span class="setting-label">DESKTOP MODE</span>
          <button id="setting-desktop-toggle" class="setting-toggle">OFF</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Ground strip with canvas -->
  <div id="ground-strip">
    <canvas id="widget-canvas"></canvas>
    <!-- Time-of-day tint overlay — sits above canvas, below UI dots -->
    <div id="time-overlay"></div>

    <!-- Needs chips -->
    <div id="needs-row">
      <div class="need-chip" id="need-hunger"  title="Hunger">
        <svg class="need-icon" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M2 6.5 a4 1.5 0 0 0 8 0 z" fill="currentColor"/>
          <path d="M2 5.5 h8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <span class="need-bar"><span class="need-bar-fill"></span></span>
      </div>
      <div class="need-chip" id="need-energy"  title="Energy">
        <svg class="need-icon" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M7 1 L3 7 H5.5 L4.5 11 L9 5 H6.5 L7 1 Z" fill="currentColor"/>
        </svg>
        <span class="need-bar"><span class="need-bar-fill"></span></span>
      </div>
      <div class="need-chip" id="need-mood"    title="Mood">
        <svg class="need-icon" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M6 10.5 C6 10.5 1 7.5 1 4.5 A2.5 2.5 0 0 1 6 3.2 A2.5 2.5 0 0 1 11 4.5 C11 7.5 6 10.5 6 10.5 Z" fill="currentColor"/>
        </svg>
        <span class="need-bar"><span class="need-bar-fill"></span></span>
      </div>
      <div class="need-chip" id="need-hygiene" title="Hygiene">
        <svg class="need-icon" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M6 1.2 C6 1.2 2.5 5 2.5 7.6 A3.5 3.5 0 0 0 9.5 7.6 C9.5 5 6 1.2 6 1.2 Z" fill="currentColor"/>
        </svg>
        <span class="need-bar"><span class="need-bar-fill"></span></span>
      </div>
    </div>

    <!-- Day counter -->
    <div id="day-label">DAY 1</div>

    <!-- Level + XP bar -->
    <div id="xp-row">
      <span id="lvl-label">LVL 1</span>
      <div id="xp-bar-wrap">
        <div id="xp-bar-fill"></div>
      </div>
    </div>

    <!-- Mood bubble -->
    <div id="mood-bubble" class="hidden"></div>

    <!-- Toast -->
    <div id="widget-toast" class="hidden"></div>
  </div>

  <script type="module" src="widget.js"></script>
</body>
</html>
